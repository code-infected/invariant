providers:
  retry:
    max_attempts: 3
    # HTTP statuses retried as infra flakes, plus "timeout" for provider failures with no
    # HTTP response. 529 is Anthropic's "overloaded" status.
    retry_on: [429, 503, 529, "timeout"]
execution:
  worker_concurrency: 8
  default_tier: smoke
judge:
  temperature: 0
  votes: 3
  embedding_prefilter_threshold_high: 0.95
  embedding_prefilter_threshold_low: 0.40
export:
  # OTLP/HTTP endpoint for `invariant export` and `invariant run --otel`, e.g. a local
  # Jaeger (http://localhost:4318). ${VAR} is read from the environment; an unset variable
  # falls back to the OTel default, http://localhost:4318. --endpoint overrides this.
  otel_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
